<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Full Timeline | Marvel Live-Action Timeline</title>

    <link rel="stylesheet" href="styles.css">
</head>
 
<body>

    <main class="timeline-page">

        <header class="timeline-header">

            <a href="index.html" class="back-link">← Back to Home</a>

            <h1>Explore and Filter</h1>

            <p>
                Explore the complete Marvel live-action timeline, with every project organised by its place in the timeline and available to search and filter.
            </p>

            <div class="timeline-switch">
                <button id="chronological-button">🕐 Chronological</button>
                <button id="release-button">🎬 Release</button>
            </div>

            <div class="timeline-search">

                <label for="timeline-search">Search</label>

                <input
                    type="text"
                    id="timeline-search"
                    placeholder="Search the timeline..."
                >

            </div>

            <div class="timeline-filter">

                <label for="type-filter">Type</label>

                <select id="type-filter">
                    <option value="all">All Types</option>
                    <option value="Film">Film</option>
                    <option value="Series">Series</option>
                    <option value="Special">Special</option>
                    <option value="Short">Short</option>
                </select>

            </div>

            <div class="timeline-filter">

                <label for="universe-filter">Universe</label>

                <select id="universe-filter">
                    <option value="all">All Universes</option>
                    <option value="MCU">MCU</option>
                    <option value="Sony">Sony</option>
                    <option value="Fox">Fox</option>
                    <option value="New Line Cinema">New Line Cinema</option>
                </select>

            </div>

            <p id="timeline-count">Showing 0 of 0 entries</p>

        </header>

        <section class="timeline-content full-timeline-content">

        </section>

    </main>

    <script>

let currentOrder = 'chronological';
let currentData = [];


function renderTimeline(data) {

    const timeline = document.querySelector('.timeline-content');

    if (!timeline) {
        throw new Error('Timeline content section not found');
    }

    timeline.innerHTML = '';

    data.forEach(item => {

        const article = document.createElement('article');
        article.className = 'timeline-entry';


        const title = document.createElement('h2');
        title.className = 'timeline-title';
        title.textContent = item.title;


        const content = document.createElement('div');
        content.className = 'timeline-info';


        const set = document.createElement('p');
        set.textContent = `Set: ${item.chronologicalYear}`;


        const release = document.createElement('p');
        release.textContent =
            `Released: ${String(item.releaseYear).substring(0, 4)}`;


        const details = document.createElement('p');
        details.textContent =
            `${item.type} • ${item.universe} • ${item.earth}`;


        const rating = document.createElement('p');
        rating.textContent = `⭐ ${item.rating}/5`;


        const overviewToggle = document.createElement('button');
        overviewToggle.className = 'overview-toggle';
        overviewToggle.textContent = 'Overview';


        const overview = document.createElement('p');
        overview.className = 'timeline-overview';
        overview.textContent = item.description;
        overview.hidden = true;


        overviewToggle.addEventListener('click', () => {

            overview.hidden = !overview.hidden;

        });


        content.appendChild(set);
        content.appendChild(release);


        if (item.flashbacks) {

            const flashbacks = document.createElement('p');
            flashbacks.textContent =
                `Flashbacks: ${item.flashbacks}`;

            content.appendChild(flashbacks);

        }


        if (item.flashForwards) {

            const flashForwards = document.createElement('p');
            flashForwards.textContent =
                `Flash-forwards: ${item.flashForwards}`;

            content.appendChild(flashForwards);

        }


        content.appendChild(details);
        content.appendChild(rating);
        content.appendChild(overviewToggle);
        content.appendChild(overview);


        if (item.poster) {

            const poster = document.createElement('img');

            poster.src = item.poster;
            poster.alt = `${item.title} poster`;
            poster.className = 'timeline-poster';

            article.appendChild(title);
            article.appendChild(poster);

        } else {

            article.appendChild(title);

        }


        article.appendChild(content);

        timeline.appendChild(article);

    });

}


function applyFilters() {

    const selectedType =
        document.getElementById('type-filter').value;

    const selectedUniverse =
        document.getElementById('universe-filter').value;

    const searchTerm =
        document.getElementById('timeline-search').value.toLowerCase().trim();


    let filteredData = currentData;


    if (selectedType !== 'all') {

        filteredData = filteredData.filter(item =>
            Array.isArray(item.type)
                ? item.type.includes(selectedType)
                : item.type === selectedType
        );

    }


    if (selectedUniverse !== 'all') {

        filteredData = filteredData.filter(item =>
            Array.isArray(item.universe)
                ? item.universe.includes(selectedUniverse)
                : item.universe === selectedUniverse
        );

    }


    if (searchTerm !== '') {

        filteredData = filteredData.filter(item =>
            item.title.toLowerCase().includes(searchTerm)
        );

    }


    const count = document.getElementById('timeline-count');

    count.textContent =
        `Showing ${filteredData.length} of ${currentData.length} entries`;


    renderTimeline(filteredData);

}


function loadTimeline(filename) {

    fetch(filename)

        .then(response => {

            if (!response.ok) {
                throw new Error(`Could not load ${filename}`);
            }

            return response.json();

        })

        .then(data => {

            if (currentOrder === 'release') {

                data.sort((a, b) =>
                    new Date(a.releaseYear) -
                    new Date(b.releaseYear)
                );

            }

            currentData = data;

            applyFilters();

        })

        .catch(error => {

            console.error(
                'Timeline loading failed:',
                error
            );

        });

}


document
    .getElementById('chronological-button')
    .addEventListener('click', () => {

        currentOrder = 'chronological';

        loadTimeline('timeline.json');

    });


document
    .getElementById('release-button')
    .addEventListener('click', () => {

        currentOrder = 'release';

        loadTimeline('release.json');

    });


document
    .getElementById('type-filter')
    .addEventListener('change', () => {

        applyFilters();

    });


document
    .getElementById('universe-filter')
    .addEventListener('change', () => {

        applyFilters();

    });


document
    .getElementById('timeline-search')
    .addEventListener('input', () => {

        applyFilters();

    });


loadTimeline('timeline.json');

</script>

</body>
</html>
