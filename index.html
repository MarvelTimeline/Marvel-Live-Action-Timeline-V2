<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">

    <title>Full Marvel Live-Action Timeline</title>
</head>

<body>

    <header class="site-header">
        <a href="index.html" class="site-logo">
            MARVEL TIMELINE
        </a>

        <a href="#" class="admin-link">
            Admin
        </a>
    </header>


    <main>

        <!-- Landing page introduction -->

        <section class="landing-intro">

            <h1>
                FULL MARVEL LIVE-ACTION TIMELINE
            </h1>

            <p class="intro-text">
                Welcome to my complete timeline of Marvel's live-action
                films, series, specials and shorts.
            </p>

        </section>


        <!-- Viewing order selection -->

        <section class="order-selection">

            <h2>
                Choose your viewing order
            </h2>

            <div class="order-options">

                <button class="order-card" data-order="chronological">

                    <span class="order-icon">
                        🕐
                    </span>

                    <span class="order-title">
                        Chronological Order
                    </span>

                    <span class="order-description">
                        Follow the story through time.
                    </span>

                </button>


                <button class="order-card" data-order="release">

                    <span class="order-icon">
                        🎬
                    </span>

                    <span class="order-title">
                        Release Order
                    </span>

                    <span class="order-description">
                        Experience Marvel as audiences did.
                    </span>

                </button>

            </div>

        </section>


        <!-- Main sections -->

        <section class="destination-section">

            <h2>
                Explore the timeline
            </h2>


            <div class="destination-grid">

                <button class="destination-card" data-section="full-timeline">

                    <span class="destination-icon">
                        📋
                    </span>

                    <span class="destination-title">
                        Full Timeline
                    </span>

                    <span class="destination-description">
                        Browse the complete timeline.
                    </span>

                </button>


                <button class="destination-card" data-section="visual-timeline">

                    <span class="destination-icon">
                        🕸️
                    </span>

                    <span class="destination-title">
                        Visual Timeline
                    </span>

                    <span class="destination-description">
                        Explore the timeline visually.
                    </span>

                </button>


                <button class="destination-card" data-section="community-ratings">

                    <span class="destination-icon">
                        🌎
                    </span>

                    <span class="destination-title">
                        Community Ratings
                    </span>

                    <span class="destination-description">
                        See what everyone thinks.
                    </span>

                </button>


                <button class="destination-card" data-section="my-ratings">

                    <span class="destination-icon">
                        ⭐
                    </span>

                    <span class="destination-title">
                        My Ratings
                    </span>

                    <span class="destination-description">
                        Explore your personal Marvel ratings.
                    </span>

                </button>

            </div>

        </section>

    </main>


    <footer class="site-footer">

        <p>
            Marvel Timeline
        </p>

    </footer>


    <script src="app.js"></script>

</body>
</html>
