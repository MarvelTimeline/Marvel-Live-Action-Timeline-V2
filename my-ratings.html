<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Ratings | Marvel Live-Action Timeline</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="site-header">

        <a
            href="index.html"
            class="site-logo"
        >
            MARVEL TIMELINE
        </a>

        <a
            href="#"
            class="admin-link"
        >
            Admin
        </a>

    </header>


    <main class="ratings-page">

        <header class="ratings-header">

            <h1>
                MY RATINGS
            </h1>

            <p>
                See how I rate the Marvel multiverse.
            </p>

        </header>

        <section class="ratings-summary">

            <div class="rating-stat">
                <span id="average-rating">—</span>
                <small>Average Rating</small>
            </div>

            <div class="rating-stat">
                <span id="rated-count">—</span>
                <small>Rated</small>
            </div>

            <div class="rating-stat">
                <span id="highest-rating">—</span>
                <small>Highest Rating</small>
            </div>

        </section>

        <section class="ratings-controls">

            <div class="ratings-search">

                <label for="ratings-search">Search</label>

                <input
                    type="text"
                    id="ratings-search"
                    placeholder="Search my ratings..."
                >

            </div>

            <div class="ratings-filter">

                <label for="ratings-type-filter">Type</label>

                <select id="ratings-type-filter">
                    <option value="all">All Types</option>
                    <option value="Film">Film</option>
                    <option value="Series">Series</option>
                    <option value="Special">Special</option>
                    <option value="Short">Short</option>
                </select>

            </div>

            <div class="ratings-sort">

                <label for="ratings-sort">Sort</label>

                <select id="ratings-sort">
                    <option value="highest">Highest Rated</option>
                    <option value="lowest">Lowest Rated</option>
                    <option value="chronological">Chronological</option>
                    <option value="release">Release Date</option>
                    <option value="az">Title A–Z</option>
                    <option value="za">Title Z–A</option>
                </select>

            </div>

        </section>

        <section class="ratings-content">

        </section>

    </main>

    <script>

let ratingsData = [];


function getRatingValue(rating) {

    const value = parseFloat(rating);

    return Number.isNaN(value) ? null : value;

}


function createStars(rating) {

    const value = getRatingValue(rating);

    if (value === null) {
        return '—';
    }

    const fullStars = Math.floor(value);
    const halfStar = value % 1 !== 0;

    let stars = '★'.repeat(fullStars);

    if (halfStar) {
        stars += '½';
    }

    return stars;

}


function renderRatings(data) {

    const container =
        document.querySelector('.ratings-content');

    container.innerHTML = '';


    if (data.length === 0) {

        const empty = document.createElement('p');

        empty.textContent = 'No ratings found.';

        empty.className = 'ratings-empty';

        container.appendChild(empty);

        return;

    }


    data.forEach(item => {

        const card = document.createElement('article');

        card.className = 'rating-card';


        const poster = document.createElement('img');

        poster.src = item.poster;
        poster.alt = `${item.title} poster`;
        poster.className = 'rating-poster';


        const details = document.createElement('div');

        details.className = 'rating-details';


        const title = document.createElement('h2');

        title.textContent = item.title;


        const metadata = document.createElement('p');

        const type =
            Array.isArray(item.type)
                ? item.type.join(' / ')
                : item.type;

        const universe =
            Array.isArray(item.universe)
                ? item.universe.join(' / ')
                : item.universe;

        metadata.textContent =
            `${type} • ${universe}`;


        const rating = document.createElement('div');

        rating.className = 'rating-display';


        const stars = document.createElement('span');

        stars.className = 'rating-stars';

        stars.textContent =
            createStars(item.rating);


        const number = document.createElement('span');

        number.className = 'rating-number';

        const value =
            getRatingValue(item.rating);

        number.textContent =
            value === null
                ? 'Rating Pending'
                : `${value}/5`;


        rating.appendChild(stars);
        rating.appendChild(number);


        details.appendChild(title);
        details.appendChild(metadata);
        details.appendChild(rating);


        card.appendChild(poster);
        card.appendChild(details);


        container.appendChild(card);

    });

}


function updateSummary(data) {

    const rated = data
        .map(item => getRatingValue(item.rating))
        .filter(value => value !== null);


    const average =
        rated.length
            ? rated.reduce((sum, value) => sum + value, 0) / rated.length
            : null;


    const highest =
        rated.length
            ? Math.max(...rated)
            : null;


    document.getElementById('average-rating').textContent =
        average === null
            ? '—'
            : `${average.toFixed(1)}/5`;


    document.getElementById('rated-count').textContent =
        rated.length;


    document.getElementById('highest-rating').textContent =
        highest === null
            ? '—'
            : `${highest}/5`;

}


function applyRatingsFilters() {

    const searchTerm =
        document
            .getElementById('ratings-search')
            .value
            .toLowerCase()
            .trim();


    const selectedType =
        document.getElementById('ratings-type-filter').value;


    const selectedSort =
        document.getElementById('ratings-sort').value;


    let filteredData =
        ratingsData.filter(item => {

            const matchesSearch =
                item.title
                    .toLowerCase()
                    .includes(searchTerm);


            const matchesType =
                selectedType === 'all'
                    ? true
                    : Array.isArray(item.type)
                        ? item.type.includes(selectedType)
                        : item.type === selectedType;


            return matchesSearch && matchesType;

        });


    filteredData.sort((a, b) => {

        const ratingA =
            getRatingValue(a.rating);

        const ratingB =
            getRatingValue(b.rating);


        if (selectedSort === 'highest') {
            return (ratingB ?? -1) - (ratingA ?? -1);
        }


        if (selectedSort === 'lowest') {
            return (ratingA ?? 999) - (ratingB ?? 999);
        }


        if (selectedSort === 'chronological') {
            return String(a.chronologicalYear)
                .localeCompare(String(b.chronologicalYear));
        }


        if (selectedSort === 'release') {
            return new Date(a.releaseYear) -
                new Date(b.releaseYear);
        }


        if (selectedSort === 'az') {
            return a.title.localeCompare(b.title);
        }


        if (selectedSort === 'za') {
            return b.title.localeCompare(a.title);
        }


        return 0;

    });


    renderRatings(filteredData);

}


function loadRatings() {

    fetch('timeline.json')

        .then(response => {

            if (!response.ok) {
                throw new Error('Could not load timeline.json');
            }

            return response.json();

        })

        .then(data => {

            ratingsData = data;

            updateSummary(ratingsData);

            applyRatingsFilters();

        })

        .catch(error => {

            console.error(
                'Ratings loading failed:',
                error
            );

        });

}


document
    .getElementById('ratings-search')
    .addEventListener('input', applyRatingsFilters);


document
    .getElementById('ratings-type-filter')
    .addEventListener('change', applyRatingsFilters);


document
    .getElementById('ratings-sort')
    .addEventListener('change', applyRatingsFilters);


loadRatings();

</script>

</body>
</html>
